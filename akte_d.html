<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AIDEN Akte #02241 – Gruppe D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#030810;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;font-family:'Exo 2',sans-serif;padding:20px 20px 80px;gap:14px;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none;z-index:9999;}
  body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0;}

  .header{position:relative;z-index:1;text-align:center;margin-top:20px;}
  .badge{display:inline-block;color:white;font-family:'Share Tech Mono',monospace;
    font-size:11px;letter-spacing:0.15em;padding:4px 16px;border-radius:2px;margin-bottom:8px;}
  .title{color:#00d4ff;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.15em;}

  .flip-wrap{position:relative;z-index:1;width:min(720px,95vw);aspect-ratio:4/3;
    perspective:1200px;cursor:pointer;}
  .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;
    transition:transform 0.75s cubic-bezier(0.4,0,0.2,1);border-radius:12px;}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;top:0;left:0;width:100%;height:100%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:12px;overflow:hidden;
    box-shadow:0 8px 48px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04);}
  .face img{width:100%;height:100%;object-fit:cover;display:block;}
  .face-back{transform:rotateY(180deg);}
  .img-placeholder{width:100%;height:100%;background:#0a1628;
    display:flex;align-items:center;justify-content:center;
    font-family:'Share Tech Mono',monospace;font-size:11px;color:#0f3460;
    flex-direction:column;gap:8px;}

  .flip-bar{position:relative;z-index:1;width:min(720px,95vw);
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Share Tech Mono',monospace;font-size:11px;color:#2a4060;letter-spacing:0.1em;}
  .flip-bar::before,.flip-bar::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,#0f3460);}
  .flip-bar::after{background:linear-gradient(90deg,#0f3460,transparent);}

  .back-btn{position:fixed;bottom:20px;left:20px;z-index:500;
    font-family:'Share Tech Mono',monospace;font-size:12px;color:#4a6080;
    background:transparent;border:1px solid #4a6080;border-radius:3px;
    padding:7px 12px;cursor:pointer;transition:all 0.2s;opacity:0.5;}
  .back-btn:hover{opacity:1;color:#00d4ff;border-color:#00d4ff;}
</style>
</head>
<body>
<button class="back-btn" onclick="history.back()">← zurück</button>

<div class="header">
  <div class="badge" style="background:#1E6B2E">■ GRUPPE D // #02241</div>
  <div class="title">SYSTEM OVERRIDE // AIDENs ERMITTLUNGSAKTE</div>
</div>

<div class="flip-wrap" onclick="this.querySelector('.card').classList.toggle('flipped')">
  <div class="card">

    <div class="face">
      <img src="akte_d_vorne.png" alt="Akte #02241 Vorderseite"
        onerror="this.parentNode.classList.add('placeholder')">
      <div class="img-placeholder" style="display:none" id="front-placeholder-d">
        <span style="font-size:24px">📄</span>
        <span>akte_d_vorne.png</span>
        <span style="font-size:10px;color:#0a2040">Bild wird geladen...</span>
      </div>
    </div>

    <div class="face face-back">
      <img src="akte_d_hinten.png" alt="Akte #02241 Rückseite"
        onerror="this.parentNode.classList.add('placeholder')">
      <div class="img-placeholder" style="display:none" id="back-placeholder-d">
        <span style="font-size:24px">📋</span>
        <span>akte_d_hinten.png</span>
        <span style="font-size:10px;color:#0a2040">Bild wird geladen...</span>
      </div>
    </div>

  </div>
</div>

<div class="flip-bar">Auf die Akte tippen zum Umdrehen</div>

<script>
// Show placeholder if image fails
document.querySelectorAll('.face img').forEach(function(img) {
  img.addEventListener('error', function() {
    this.style.display = 'none';
    var placeholder = this.nextElementSibling;
    if(placeholder) placeholder.style.display = 'flex';
  });
});
</script>
</body>
</html>
